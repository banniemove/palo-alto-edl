name: Update ip-list-nl.txt

on:
  schedule:
    - cron: "17 3 * * 1"   # elke maandag 03:17 UTC
  workflow_dispatch:        # handmatig starten via het tabblad Actions
  push:
    branches: [main]
    paths:
      - asns.txt
      - exclude.txt
      - scripts/update_ip_list_nl.py
      - .github/workflows/update-ip-list-nl.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prefixes ophalen bij RIPEstat
        run: python scripts/update_ip_list_nl.py
      - name: Commit als er iets veranderd is
        run: |
          if git diff --quiet -- ip-list-nl.txt; then
            echo "Geen wijzigingen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add ip-list-nl.txt
          git commit -m "ip-list-nl.txt bijgewerkt ($(date -u +%Y-%m-%d))"
          git push
