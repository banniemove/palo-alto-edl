name: Update IP-lijsten

on:
  schedule:
    - cron: "17 3 * * 1"   # elke maandag 03:17 UTC
  workflow_dispatch:        # handmatig starten via het tabblad Actions
  push:
    branches: [main]
    paths:
      - asns-*.txt
      - exclude-*.txt
      - scripts/update_ip_list.py
      - .github/workflows/update-ip-list-nl.yml

permissions:
  contents: write

concurrency:
  group: update-ip-lists
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Alle landen bijwerken
        run: |
          failed=""
          for f in asns-*.txt; do
            cc="${f#asns-}"; cc="${cc%.txt}"
            echo "::group::$cc"
            python scripts/update_ip_list.py "$cc" || failed="$failed $cc"
            echo "::endgroup::"
          done
          echo "FAILED=$failed" >> "$GITHUB_ENV"
      - name: Commit als er iets veranderd is
        run: |
          git add ip-list-*.txt reports/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "IP-lijsten bijgewerkt ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main
            git push
          else
            echo "Geen wijzigingen."
          fi
      - name: Mislukte landen melden
        if: env.FAILED != ''
        run: |
          echo "Niet bijgewerkt:${FAILED}"
          exit 1
