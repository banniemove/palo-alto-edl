name: Update IP-lijsten (NL, FR)

on:
  schedule:
    - cron: "17 3 * * 1"   # elke maandag 03:17 UTC
  workflow_dispatch:        # handmatig starten via het tabblad Actions
  push:
    branches: [main]
    paths:
      - asns-*.txt
      - exclude-*.txt
      - scripts/update_ip_list.py
      - .github/workflows/update-ip-list-nl.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Nederland
        run: python scripts/update_ip_list.py asns-nl.txt exclude-nl.txt ip-list-nl.txt
      - name: Frankrijk
        if: always()   # NL-fout mag FR niet blokkeren
        run: python scripts/update_ip_list.py asns-fr.txt exclude-fr.txt ip-list-fr.txt
      - name: Commit als er iets veranderd is
        if: always()
        run: |
          git add ip-list-*.txt
          if git diff --cached --quiet; then
            echo "Geen wijzigingen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "IP-lijsten bijgewerkt ($(date -u +%Y-%m-%d))"
          git push
